<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1, user-scalable=no">
<title>Solo RPG</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="theme-color" content="#14110F">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<style>
  :root {
    --bg:#14110F; --panel:#1F1B17; --panel-raised:#282320; --border:#3A332B;
    --gold:#C9A227; --gold-dim:#8A711F; --wax:#8B2E2E;
    --text:#EDE6D6; --text-muted:#9C9284; --text-faint:#6B6255;
  }
  * { box-sizing: border-box; }
  body { margin:0; background:var(--bg); color:var(--text); font-family: Georgia, 'Iowan Old Style', serif; }
  input, textarea { font-family: inherit; }
  button { font-family: inherit; cursor:pointer; background:none; border:none; color:inherit; padding:0; margin:0; -webkit-appearance:none; appearance:none; }
  .app-shell { display:flex; justify-content:center; min-height:100vh; }
  .main { width:100%; max-width:480px; padding:16px 12px 96px; display:flex; flex-direction:column; gap:12px; }
  @media (min-width: 768px) {
    .main { max-width: 1100px; padding-left: 112px; padding-right: 24px; padding-bottom: 32px; }
  }
  .grid-cards { display:grid; grid-template-columns: repeat(auto-fit, minmax(260px, 1fr)); gap:12px; align-items:start; }
  .grid-cards > * { min-width:0; }
  .masonry-cards { column-width:260px; column-gap:12px; }
  .masonry-cards > * { break-inside:avoid; -webkit-column-break-inside:avoid; min-width:0; margin:0 0 12px; }
  .split-grid { display:grid; grid-template-columns: 1fr; gap:16px; align-items:start; }
  @media (min-width: 900px) {
    .main:has(.split-grid) { max-width: 1500px; }
    .split-grid { grid-template-columns: 1fr 1fr; }
  }
  .split-pane { background:var(--panel); border:1px solid var(--border); border-radius:12px; padding:10px; display:flex; flex-direction:column; gap:10px; min-width:0; max-width:100%; overflow:hidden; }
  .split-pane-header { padding:2px 4px 8px; border-bottom:1px solid var(--border); }
  .split-pane-body { display:flex; flex-direction:column; gap:12px; min-width:0; max-width:100%; }
  .splitview-btn { display:none; }
  @media (min-width: 900px) { .splitview-btn { display:inline-flex; } }
  .span-all { grid-column: 1 / -1; }
  .panel { background:var(--panel); border:1px solid var(--border); border-radius:12px; padding:12px; display:flex; flex-direction:column; gap:10px; min-width:0; }
  .label { font-size:11px; text-transform:uppercase; letter-spacing:0.08em; color:var(--text-faint); font-family: ui-monospace, monospace; display:flex; align-items:center; gap:6px; }
  .row { display:flex; align-items:center; gap:8px; }
  .between { justify-content:space-between; }
  .wrap { flex-wrap:wrap; }
  .btn { border-radius:10px; padding:10px 14px; font-size:14px; }
  .btn-gold { background:var(--gold); color:var(--bg); font-weight:600; }
  .btn-raised { background:var(--panel-raised); color:var(--gold); border:1px solid var(--gold-dim); }
  .btn-outline-wax { background:transparent; color:var(--wax); border:1px solid var(--wax); }
  input[type=text], input[type=number], textarea {
    width:100%; background:var(--bg); color:var(--text); border:1px solid var(--border);
    border-radius:10px; padding:8px 10px; font-size:14px; outline:none;
  }
  input[type=number] { -moz-appearance:textfield; appearance:textfield; }
  input[type=number]::-webkit-outer-spin-button, input[type=number]::-webkit-inner-spin-button {
    -webkit-appearance:none; margin:0;
  }
  textarea { resize:none; font-family: Georgia, serif; }
  .grid-dice { display:grid; grid-template-columns: repeat(4,1fr); gap:8px; }
  .die-btn { padding:10px 0; border-radius:10px; background:var(--panel-raised); color:var(--gold); border:1px solid var(--border); font-size:14px; text-align:center; }
  .log-entry { display:flex; gap:8px; padding:6px 8px; border-radius:8px; border-left:2px solid transparent; min-width:0; }
  .log-entry.latest { background:var(--panel-raised); border-left-color:var(--gold); }
  .log-time { font-family: ui-monospace, monospace; font-size:10px; color:var(--text-faint); min-width:32px; padding-top:2px; flex-shrink:0; }
  .log-text { font-size:14px; white-space:pre-line; color:var(--text-muted); min-width:0; overflow-wrap:break-word; word-break:break-word; }
  .log-entry.latest .log-text { color:var(--text); }
  .table-row, .npc-card, .statblock-card, .combo-row { background:var(--panel-raised); border:1px solid var(--border); border-radius:10px; padding:10px 12px; }
  .empty { text-align:center; color:var(--text-faint); font-size:14px; padding:16px 0; display:flex; flex-direction:column; gap:8px; align-items:center; }
  .counter-btn { width:36px; height:36px; border-radius:10px; background:var(--panel-raised); color:var(--gold); border:1px solid var(--border); font-size:18px; text-align:center; }
  .field-type-grid { display:grid; grid-template-columns:1fr 1fr; gap:8px; }
  .field-type-btn { display:flex; align-items:center; gap:8px; border-radius:10px; padding:10px 12px; background:transparent; border:1px solid var(--border); color:var(--text-muted); font-size:14px; }
  .field-type-btn.selected { background:var(--panel-raised); border-color:var(--gold); color:var(--text); }
  .thread-item { display:flex; align-items:center; gap:8px; background:var(--panel-raised); border:1px solid var(--border); border-radius:10px; padding:10px 12px; }
  .thread-check { width:20px; height:20px; border-radius:50%; border:1.5px solid var(--gold); background:transparent; display:flex; align-items:center; justify-content:center; color:var(--bg); font-size:12px; flex-shrink:0; }
  .thread-check.done { background:var(--gold-dim); border-color:var(--gold-dim); }
  .header { display:flex; align-items:center; justify-content:space-between; padding:0 4px; }
  .brand { display:flex; align-items:center; gap:8px; }
  .brand-badge { width:34px; height:34px; border-radius:50%; background:var(--panel-raised); border:1px solid var(--gold); display:flex; align-items:center; justify-content:center; font-size:16px; flex-shrink:0; }
  .brand h1 { font-size:20px; margin:0; letter-spacing:0.02em; font-weight:normal; line-height:1.2; }
  .campaign-switch-btn { font-family: ui-monospace, monospace; font-size:11px; color:var(--text-faint); display:flex; align-items:center; gap:3px; }
  .header-actions { display:flex; gap:4px; }
  .icon-btn { background:transparent; color:var(--text-muted); padding:8px; border-radius:10px; font-size:16px; }
  .icon-btn.active { background:var(--gold); color:var(--bg); }
  .icon-btn.raised { background:var(--panel-raised); border:1px solid var(--border); }
  .navbar-bottom { position:fixed; bottom:0; left:0; right:0; background:var(--panel); border-top:1px solid var(--border); display:flex; justify-content:center; }
  .navbar-bottom .inner { width:100%; max-width:480px; display:flex; }
  .navbar-bottom button { flex:1; display:flex; flex-direction:column; align-items:center; gap:2px; padding:10px 0; color:var(--text-faint); font-family: ui-monospace, monospace; font-size:10px; }
  .navbar-bottom button.active { color:var(--gold); }
  .nav-icon { font-size:18px; }
  @media (min-width: 768px) { .navbar-bottom { display:none; } }
  .sidebar { display:none; }
  @media (min-width: 768px) {
    .sidebar { display:flex; flex-direction:column; align-items:center; gap:4px; position:fixed; top:0; left:0; bottom:0; width:88px; background:var(--panel); border-right:1px solid var(--border); padding:24px 8px; }
    .sidebar button { width:100%; display:flex; flex-direction:column; align-items:center; gap:4px; padding:10px 0; border-radius:10px; color:var(--text-faint); font-family: ui-monospace, monospace; font-size:10px; }
    .sidebar button.active { color:var(--gold); background:var(--panel-raised); }
    .sidebar .nav-icon { font-size:20px; }
  }
  .field-label-row { display:flex; align-items:center; justify-content:space-between; }
  .small-muted { font-size:11px; color:var(--text-faint); }
  .list-item-row { display:flex; align-items:center; gap:8px; background:var(--bg); border:1px solid var(--border); border-radius:10px; padding:6px 10px; }
  .x-btn { color:var(--text-faint); font-size:14px; }
  .modal-overlay { position:fixed; inset:0; background:rgba(0,0,0,0.6); display:flex; align-items:flex-end; justify-content:center; z-index:50; }
  .modal-sheet { width:100%; max-width:480px; background:var(--panel); border:1px solid var(--border); border-bottom:none; border-radius:16px 16px 0 0; padding:16px; display:flex; flex-direction:column; gap:12px; max-height:85vh; overflow-y:auto; }
  .pill { padding:6px 12px; border-radius:999px; font-size:14px; white-space:nowrap; flex-shrink:0; border:1px solid var(--border); }
  .pill.active { background:var(--gold); color:var(--bg); }
  .pill.inactive { background:var(--panel-raised); color:var(--text-muted); }
  .pill-scroll { display:flex; align-items:center; gap:8px; overflow-x:auto; padding-bottom:4px; }
  .mode-toggle { display:flex; border-radius:10px; overflow:hidden; border:1px solid var(--border); }
  .mode-toggle button { flex:1; padding:8px 0; font-size:12px; }
  .map-svg-wrap { max-width:480px; max-height:60vh; overflow:auto; margin:0 auto; background:var(--bg); border:1px solid var(--border); border-radius:10px; }
  .map-svg-wrap svg { display:block; touch-action:manipulation; }
  #file-import { display:none; }
  .link-chip { color:var(--gold); text-decoration:underline; text-underline-offset:2px; background:none; border:none; padding:0; font:inherit; cursor:pointer; display:inline; }
</style>
</head>
<body>
<div class="app-shell">
  <div class="sidebar" id="sidebar"></div>
  <div class="main" id="main"></div>
  <div class="navbar-bottom"><div class="inner" id="bottomnav"></div></div>
</div>
<input type="file" id="file-import" accept="application/json">
<input type="file" id="file-import-tables" accept="application/json" multiple style="display:none;">
<script>
const SPECIAL_TABS = {
  notes: {defaultLabel:'Text', defaultIcon:'📜'},
  dice: {defaultLabel:'Orakel', defaultIcon:'🎲'},
  character: {defaultLabel:'Charakter', defaultIcon:'🧙'},
  map: {defaultLabel:'Karte', defaultIcon:'🗺️'},
  relations: {defaultLabel:'Beziehungen', defaultIcon:'🕸️'},
  battle: {defaultLabel:'Kampf', defaultIcon:'⚔️'},
};
function getAllTabs(){
  const active = getActive();
  const karteiMap = {};
  active.karteien.forEach(k=>karteiMap[k.id]=k);
  return active.tabOrder.map(id=>{
    if(SPECIAL_TABS[id]){
      const ov = (active.tabOverrides||{})[id] || {};
      const label = ov.label && ov.label.trim() ? ov.label : SPECIAL_TABS[id].defaultLabel;
      const icon = ov.icon && ov.icon.trim() ? ov.icon : SPECIAL_TABS[id].defaultIcon;
      return {id, label, icon, special:true};
    }
    const k = karteiMap[id];
    if(k) return {id, label:k.name, icon:k.icon||'📇', special:false};
    return null;
  }).filter(Boolean);
}

const FIELD_TYPES = [
  {id:'number', label:'Zahl (fest)'},
  {id:'counter', label:'Zahl (+/-)'},
  {id:'text', label:'Freitext'},
  {id:'list', label:'Liste'},
  {id:'status', label:'Status (6 Kästchen)'},
  {id:'table', label:'Tabelle (Spalten)'},
];

const STORAGE_KEY = 'solorpg-data';
const LEGACY_STORAGE_KEY = 'losbuch-data';

function uid(){ return Math.random().toString(36).slice(2,10); }
function rollDie(sides){ return Math.floor(Math.random()*sides)+1; }
function parseFormula(raw){
  const m = raw.trim().match(/^(\d*)[dw](\d+)\s*([+-]\s*\d+)?$/i);
  if(!m) return null;
  const count = m[1] ? parseInt(m[1],10) : 1;
  const sides = parseInt(m[2],10);
  const mod = m[3] ? parseInt(m[3].replace(/\s/g,''),10) : 0;
  if(count<1||count>100||sides<2) return null;
  return {count,sides,mod};
}
function timeNow(){
  const d = new Date();
  return d.toLocaleTimeString('de-DE',{hour:'2-digit',minute:'2-digit'});
}
function defaultValueForType(type){
  if(type==='list') return [];
  if(type==='text') return '';
  if(type==='status') return [false,false,false,false,false,false];
  if(type==='table') return {columns:['Spalte 1','Spalte 2'], rows:[]};
  return '0';
}
function escapeHtml(s){
  return String(s==null?'':s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}
// --- Shared graph/SVG helpers (used by Karte and Beziehungen) ---
function pairKey(a,b){ return [a,b].sort().join('|'); }
function labelBoxWidth(text){ return Math.max(30, String(text).length*5.6+12); }
function nodeBoxWidth(text){ return Math.max(60, String(text).length*6.2+16); }
// Ray from node center toward (tx,ty), clipped to the node's rectangle boundary.
function rectEdgePoint(cx, cy, halfw, halfh, tx, ty){
  const dx = tx-cx, dy = ty-cy;
  if(dx===0 && dy===0) return {x:cx, y:cy};
  const sx = dx!==0 ? halfw/Math.abs(dx) : Infinity;
  const sy = dy!==0 ? halfh/Math.abs(dy) : Infinity;
  const s = Math.min(sx, sy, 1);
  return {x:cx+dx*s, y:cy+dy*s};
}
// For a pair of nodes with >1 edge between them, curve bend must use the SAME
// sign for both directions of travel (the perpendicular flips automatically
// when source/target reverse) — using opposite signs makes them overlap.
function curveBend(fromId, toId, pairCount, magnitude){
  return pairCount>1 ? magnitude : 0;
}
// Pushes apart any two label boxes (by center + size) that overlap, so labels
// from unrelated edges never sit on top of each other. Mutates geoms in place.
function resolveLabelOverlaps(geoms, iterations){
  for(let it=0; it<(iterations||8); it++){
    let moved = false;
    for(let i=0;i<geoms.length;i++){
      for(let j=i+1;j<geoms.length;j++){
        const A=geoms[i], B=geoms[j];
        const ax1=A.cx-A.w/2, ax2=A.cx+A.w/2, ay1=A.cy-A.h/2, ay2=A.cy+A.h/2;
        const bx1=B.cx-B.w/2, bx2=B.cx+B.w/2, by1=B.cy-B.h/2, by2=B.cy+B.h/2;
        const overlapX = Math.min(ax2,bx2) - Math.max(ax1,bx1);
        const overlapY = Math.min(ay2,by2) - Math.max(ay1,by1);
        if(overlapX>0 && overlapY>0){
          moved = true;
          const dx = B.cx-A.cx, dy = B.cy-A.cy;
          const dist = Math.hypot(dx,dy) || 0.01;
          const push = Math.min(overlapX, overlapY)/2 + 3;
          const ux = dx/dist, uy = dy/dist;
          A.cx -= ux*push; A.cy -= uy*push;
          B.cx += ux*push; B.cy += uy*push;
        }
      }
    }
    if(!moved) break;
  }
}
// Given a set of {id,x,y} nodes and {from,to} edges, computes a quadratic-
// bezier control point per edge. When two nodes share more than one edge
// (bidirectional relationships, a two-way map connection drawn as two one-
// way ones, etc.) the perpendicular axis is taken from a CANONICAL (sorted)
// node-id pair rather than each edge's own from->to direction — otherwise
// the offset's sign flips when direction reverses and both edges land back
// on top of each other. Edges to/from a missing node are dropped.
function curvedEdgeGeometry(nodes, edges, magnitude){
  const byId = {}; nodes.forEach(n=>byId[n.id]=n);
  const pairCounts = {};
  edges.forEach(e=>{ const k=pairKey(e.from,e.to); pairCounts[k]=(pairCounts[k]||0)+1; });
  return edges.map(e=>{
    const A=byId[e.from], B=byId[e.to];
    if(!A||!B) return null;
    const canon = [e.from,e.to].slice().sort();
    const C1=byId[canon[0]], C2=byId[canon[1]];
    const cdx=C2.x-C1.x, cdy=C2.y-C1.y;
    const clen=Math.hypot(cdx,cdy)||1;
    const perpx=-cdy/clen, perpy=cdx/clen;
    const sign = e.from===canon[0] ? 1 : -1;
    const pc = pairCounts[pairKey(e.from,e.to)];
    const bend = pc>1 ? sign*magnitude : 0;
    const mx=(A.x+B.x)/2+perpx*bend, my=(A.y+B.y)/2+perpy*bend;
    return {edge:e, A, B, mx, my};
  }).filter(Boolean);
}
// Ray from a circular node's center toward (tx,ty), clipped to its radius —
// used for the map's round room nodes (Beziehungen uses rectEdgePoint instead).
function circleEdgePoint(cx, cy, r, tx, ty){
  const dx=tx-cx, dy=ty-cy;
  const d=Math.hypot(dx,dy)||1;
  return {x:cx+dx/d*r, y:cy+dy/d*r};
}
function renderStatusControl(boxes, onToggle, onReduce, onClear, reduceInputId){
  const tier = (()=>{ for(let i=5;i>=0;i--){ if(boxes[i]) return i+1; } return 0; })();
  return `<div style="display:flex;flex-direction:column;gap:8px;">
    <div class="row" style="gap:6px;">
      ${boxes.map((marked,idx)=>`<button class="counter-btn" style="${marked?'background:var(--gold);color:var(--bg);border-color:var(--gold);':''}width:32px;height:32px;font-size:13px;" onclick="${onToggle(idx)}">${idx+1}</button>`).join('')}
      <span class="small-muted" style="margin-left:6px;">Tier ${tier}</span>
    </div>
    <div class="row" style="gap:6px;">
      <input type="number" min="1" max="6" placeholder="Um" id="${reduceInputId}" style="width:64px;">
      <button class="btn btn-raised" style="padding:6px 10px;font-size:12px;" onclick="${onReduce(reduceInputId)}">− Reduzieren</button>
      <button class="icon-btn raised" title="Zurücksetzen" onclick="${onClear()}">↺</button>
    </div>
  </div>`;
}
// Old text-based entry syntax ("Text >> Tabelle"), kept only to migrate
// pre-existing tables into the new structured entry format.
function legacyParseChainSyntax(text){
  const lines = text.split('\n');
  const displayLines = [];
  let linkNames = [];
  lines.forEach(line=>{
    const idx = line.indexOf('>>');
    if(idx===-1){ displayLines.push(line); return; }
    const before = line.slice(0,idx).replace(/\s+$/,'');
    const after = line.slice(idx+2).trim();
    if(before) displayLines.push(before);
    if(after) linkNames = linkNames.concat(after.split(',').map(s=>s.trim()).filter(Boolean));
  });
  return {display: displayLines.join('\n').trim(), linkNames};
}
function migrateTableEntries(rawEntries){
  return (rawEntries||[]).map(e=>{
    if(typeof e === 'string'){
      const {display, linkNames} = legacyParseChainSyntax(e);
      return {id:uid(), text:display, range:null, links:linkNames};
    }
    return Object.assign({id:uid(), text:'', range:null, links:[]}, e);
  });
}
function computeDiceRange(formula){
  const parsed = parseFormula(formula);
  if(!parsed) return null;
  return {min: parsed.count + parsed.mod, max: parsed.count*parsed.sides + parsed.mod};
}
function checkCoverage(entries, formula){
  const range = computeDiceRange(formula);
  if(!range) return null;
  const span = range.max - range.min + 1;
  if(span <= 0 || span > 300) return null;
  const counts = new Array(span).fill(0);
  entries.forEach(e=>{
    if(!e.range) return;
    const lo = Math.max(e.range.min, range.min);
    const hi = Math.min(e.range.max, range.max);
    for(let v=lo; v<=hi; v++) counts[v-range.min]++;
  });
  const gaps = [], dupes = [];
  counts.forEach((c,i)=>{ const val=range.min+i; if(c===0) gaps.push(val); if(c>1) dupes.push(val); });
  return {range, gaps, dupes};
}
function normalizeImportedEntry(e){
  if(typeof e === 'string') return {id:uid(), text:e, range:null, links:[]};
  return {
    id: uid(),
    text: e.text!=null ? (Array.isArray(e.text) ? e.text.join('\n') : String(e.text)) : '',
    range: e.range ? {min:Number(e.range.min), max:Number(e.range.max)} : null,
    links: Array.isArray(e.links) ? e.links.map(String) : [],
  };
}
function parseJSONImport(raw){
  let data;
  try{ data = JSON.parse(raw); }catch(e){ return {error: 'Ungültiges JSON: '+e.message}; }
  const arr = Array.isArray(data) ? data : [data];
  const tables = [];
  const karteien = [];
  const characters = [];
  arr.forEach(t=>{
    const looksLikeKartei = !t.mode && Array.isArray(t.entries) && t.entries.some(e=>e && typeof e==='object' && 'title' in e);
    const looksLikeCharacter = !t.mode && !t.entries && Array.isArray(t.sections);
    if(looksLikeKartei){
      karteien.push({
        name: t.name || 'Unbenannt',
        icon: (t.icon||'').trim() || '📇',
        hasCheckbox: !!t.hasCheckbox,
        entries: t.entries.map(e=>({
          title: e.title || '', notes: e.notes || '', resolved: !!e.resolved,
        })),
      });
      return;
    }
    if(looksLikeCharacter){
      characters.push({
        name: t.name || 'Unbenannt',
        sections: t.sections.map(s=>({
          name: s.name || 'Bereich',
          fields: (s.fields||[]).map(f=>{
            const type = ['number','counter','text','list','status','table'].includes(f.type) ? f.type : 'text';
            let value = f.value;
            if(type==='status'){
              value = Array.isArray(value) && value.length===6 ? value : [false,false,false,false,false,false];
            } else if(type==='table'){
              value = (value && Array.isArray(value.columns) && Array.isArray(value.rows)) ? value : {columns:['Spalte 1'], rows:[]};
            } else if(type==='list'){
              value = Array.isArray(value) ? value : [];
            } else if(type==='text'){
              value = value!=null ? String(value) : '';
            } else {
              value = value!=null ? String(value) : '0';
            }
            return {name: f.name || 'Feld', type, value};
          }),
        })),
      });
      return;
    }
    const mode = t.mode==='aspects' ? 'aspects' : 'list';
    if(mode==='aspects'){
      const aspects = (t.aspects||[]).map(a=>({
        id: uid(), name: a.name || 'Aspekt',
        distMode: a.distMode==='dist' ? 'dist' : 'equal',

function ensureCampaign(data){

  }));

    id:k.id||uid(), name:k.name||'Kartei', icon:k.icon||'📇', hasCheckbox: !!k.hasCheckbox,
    entries: (k.entries||[]).map(e=>({id:e.id||uid(), title:e.title||'', notes:e.notes||'', resolved:!!e.resolved, parentId:e.parentId||null, collapsed:!!e.collapsed})),
  }));

    id: c.id||uid(), name: c.name||'Charakter',

      fields: (s.fields||[]).map(f=>({
        id: f.id||uid(), name: f.name||'Feld', type: f.type||'text', value: f.value,
        tier: (f.tier==='surface'||f.tier==='scene'||f.tier==='rare') ? f.tier : (f.type==='counter' ? 'surface' : 'rare'),

    id: t.id, name: t.name, mode: t.mode || 'list',

    d.tables.forEach(t=>{ if(t.group && !presentGroups.includes(t.group)) presentGroups.push(t.group); });
    let order = Array.isArray(d.groupOrder) ? d.groupOrder.filter(g=>presentGroups.includes(g)) : [];

function migrateLegacy(parsed){

function handleFormula(ctx){
  ctx = ctx || 'oracle';

  const parsed = parseFormula(formula);
  if(!parsed){ pushLog(`Ungültige Eingabe: "${formula}" (Beispiel: 2W6+1)`, ctx); render(); return; }
  const rolls = Array.from({length:parsed.count}, ()=>rollDie(parsed.sides));
  const sum = rolls.reduce((a,b)=>a+b,0)+parsed.mod;
  const modText = parsed.mod ? (parsed.mod>0?` +${parsed.mod}`:` ${parsed.mod}`) : '';
  pushLog(`${formula}: [${rolls.join(', ')}]${modText} = ${sum}`, ctx);

function findTableByName(name){
  return getActive().tables.find(t=>t.name.trim().toLowerCase()===name.trim().toLowerCase());
}
function pickEntry(entries, distMode, formula){
  if(!entries.length) return {entry:null, rollInfo:''};
  if(distMode==='dist'){
    const parsed = parseFormula(formula);
    if(!parsed) return {entry: entries[Math.floor(Math.random()*entries.length)], rollInfo:''};
    const rolls = Array.from({length:parsed.count}, ()=>rollDie(parsed.sides));
    const sum = rolls.reduce((a,b)=>a+b,0) + parsed.mod;
    const match = entries.find(e=>e.range && sum>=e.range.min && sum<=e.range.max);
    return {entry: match || null, rollInfo: ` [${formula}: ${sum}]`};
  }
  return {entry: entries[Math.floor(Math.random()*entries.length)], rollInfo:''};
}
function resolveInlineRefs(text, depth, visited){
  if(!text) return text;
  return text.replace(/\{\{([^}]+)\}\}/g, (whole, name)=>{
    if(depth>5) return '[zu tief verschachtelt]';
    const table = findTableByName(name.trim());
    if(!table) return `[${name.trim()} nicht gefunden]`;
    if(visited.has(table.id)) return '[Zirkelverweis]';
    const nextVisited = new Set(visited);
    nextVisited.add(table.id);
    const core = rollTableCore(table, depth+1, nextVisited);
    return core.text;
  });
}
function rollTableCore(table, depth, visited){
  return table.mode==='aspects' ? rollAspectsCore(table, depth, visited) : rollListCore(table, depth, visited);
}
function rollListCore(table, depth, visited){
  const {entry, rollInfo} = pickEntry(table.entries, table.distMode, table.formula);
  if(!entry) return {text:`(kein Eintrag${rollInfo})`, blockLines:[], rollInfo:''};
  const nextVisited = new Set(visited);
  nextVisited.add(table.id);
  const resolvedText = resolveInlineRefs(entry.text, depth, nextVisited);
  const blockLines = [];
  (entry.links||[]).forEach(name=>{
    const linked = findTableByName(name);
    if(!linked){ blockLines.push(`↳ "${name}" nicht gefunden`); return; }
    if(nextVisited.has(linked.id)){ blockLines.push('↳ Zirkelverweis übersprungen'); return; }
    if(depth>5){ blockLines.push('↳ zu tief verschachtelt'); return; }
    const subFull = rollTableFull(linked, depth+1, nextVisited);
    blockLines.push(subFull.split('\n').map(l=>'  ↳ '+l).join('\n'));
  });
  return {text: resolvedText, blockLines, rollInfo};
}
function rollAspectsCore(table, depth, visited){
  if(!table.aspects || !table.aspects.length) return {text:'(keine Aspekte)', blockLines:[], rollInfo:''};
  const nextVisited = new Set(visited);
  nextVisited.add(table.id);
  const lines = [];
  table.aspects.forEach(a=>{
    const {entry, rollInfo} = pickEntry(a.options, a.distMode, a.formula);
    if(!entry){ lines.push(`${a.name}: (kein Eintrag${rollInfo})`); return; }
    const resolvedText = resolveInlineRefs(entry.text, depth, nextVisited);
    const dispLines = resolvedText.split('\n');
    lines.push(`${a.name}: ${dispLines[0]}${rollInfo}`);
    dispLines.slice(1).forEach(l=>lines.push(`  ${l}`));
    (entry.links||[]).forEach(name=>{
      const linked = findTableByName(name);
      if(!linked){ lines.push(`  ↳ "${name}" nicht gefunden`); return; }
      if(nextVisited.has(linked.id) || depth>5){ lines.push('  ↳ übersprungen'); return; }
      const subFull = rollTableFull(linked, depth+1, nextVisited);
      lines.push(subFull.split('\n').map(l=>'    ↳ '+l).join('\n'));
    });
  });
  return {text: lines.join('\n'), blockLines: [], rollInfo:''};
}
function rollTableFull(table, depth, visited){
  const core = rollTableCore(table, depth, visited);
  if(table.mode==='aspects'){
    return [`${table.name}:`, ...core.text.split('\n').map(l=>'  '+l)].join('\n');
  }
  const dispLines = core.text.split('\n');
  const lines = [`${table.name}: ${dispLines[0]}${core.rollInfo||''}`];
  dispLines.slice(1).forEach(l=>lines.push(`  ${l}`));
  core.blockLines.forEach(l=>lines.push(l));
  return lines.join('\n');
}

function moveTable(id, dir){
  updateActive(camp=>{
    const arr = [...camp.tables];
    const idx = arr.findIndex(t=>t.id===id);
    if(idx===-1) return camp;
    const group = arr[idx].group||'';
    const groupIdxs = arr.map((t,i)=>({t,i})).filter(o=>(o.t.group||'')===group).map(o=>o.i);
    const posInGroup = groupIdxs.indexOf(idx);
    const newPosInGroup = posInGroup + dir;
    if(newPosInGroup<0 || newPosInGroup>=groupIdxs.length) return camp;
    const i1 = groupIdxs[posInGroup], i2 = groupIdxs[newPosInGroup];
    [arr[i1], arr[i2]] = [arr[i2], arr[i1]];
    return {...camp, tables:arr};
  });

}

    const order = [...camp.groupOrder];
    const idx = order.indexOf(name);
    const newIdx = idx+dir;
    if(idx===-1 || newIdx<0 || newIdx>=order.length) return camp;
    [order[idx], order[newIdx]] = [order[newIdx], order[idx]];
    return {...camp, groupOrder:order};
  });
  saveState(); render();
}
function startImport(){ ui.importText=''; ui.showImport=true; render(); }
function cancelImport(){ ui.showImport=false; render(); }
function onImportTextInput(el){ ui.importText = el.value; }
function runImport(){
  const result = parseJSONImport(ui.importText);
  if(result.error){ alert(result.error); return; }
  if(!result.tables.length && !result.karteien.length && !result.characters.length) return;
  updateActive(camp=>{
    const tables = [...camp.tables];
    result.tables.forEach(({name, group, mode, distMode, formula, entries, aspects})=>{
      group = (group||'').trim();
      const idx = tables.findIndex(t=>t.name.trim().toLowerCase()===name.trim().toLowerCase());
      if(idx>=0) tables[idx] = Object.assign({}, tables[idx], {name, group, mode, distMode, formula, entries, aspects});
      else tables.push({id:uid(), name, group, mode, distMode, formula, entries, aspects});
    });
    const karteien = [...camp.karteien];
    const tabOrder = [...camp.tabOrder];
    result.karteien.forEach(({name, icon, hasCheckbox, entries})=>{
      const idx = karteien.findIndex(k=>k.name.trim().toLowerCase()===name.trim().toLowerCase());
      const newEntries = entries.map(e=>({
        id: uid(), title: e.title, notes: e.notes, resolved: e.resolved,
        parentId: null, collapsed: false,
      }));
      if(idx>=0){
        karteien[idx] = {...karteien[idx], entries: [...karteien[idx].entries, ...newEntries]};
      } else {
        const newKartei = {id:uid(), name, icon, hasCheckbox, entries: newEntries};
        karteien.push(newKartei);
        tabOrder.push(newKartei.id);
      }
    });
    let characters = [...camp.characters];
    let activeCharacterId = camp.activeCharacterId;
    result.characters.forEach(({name, sections})=>{
      const idx = characters.findIndex(c=>c.name.trim().toLowerCase()===name.trim().toLowerCase());
      const newSections = sections.map(s=>({
        id: uid(), name: s.name,
        fields: s.fields.map(f=>({id:uid(), name:f.name, type:f.type, value:f.value})),
      }));
      if(idx>=0){
        const existing = characters[idx];
        const mergedSections = [...existing.sections];
        newSections.forEach(ns=>{
          const sidx = mergedSections.findIndex(es=>es.name.trim().toLowerCase()===ns.name.trim().toLowerCase());
          if(sidx>=0) mergedSections[sidx] = ns;
          else mergedSections.push(ns);
        });
        characters[idx] = {...existing, sections: mergedSections};
      } else {
        const newChar = {id:uid(), name, sections:newSections};
        characters.push(newChar);
        if(!activeCharacterId) activeCharacterId = newChar.id;
      }
    });
    return {...camp, tables, karteien, tabOrder, characters, activeCharacterId};
  });
  ui.showImport=false; saveState(); render();
}

// ---- Links ([[Name]] / [[<karteiname>:Name]] / [[text:Name]]) ----
function resolveLink(raw){
  const active = getActive();
  let category = null;
  let query = raw;
  const catMatch = raw.match(/^([^:]+):(.+)$/);
  if(catMatch){ category = catMatch[1].trim().toLowerCase(); query = catMatch[2]; }
  const q = query.trim().toLowerCase();
  if(!q) return null;

  const tryKartei = (k) => k.entries.find(e=>e.title.trim().toLowerCase()===q);
  const tryJournal = () => active.journal.find(j=>(j.title||'').trim().toLowerCase()===q);

  if(category){
    if(category==='text'){ const r=tryJournal(); return r?{type:'text', item:r}:null; }
    const kartei = active.karteien.find(k=>k.name.trim().toLowerCase()===category);
    if(kartei){ const r=tryKartei(kartei); return r?{type:'kartei', karteiId:kartei.id, item:r}:null; }
    return null;
  }
  for(const k of active.karteien){
    const r = tryKartei(k);
    if(r) return {type:'kartei', karteiId:k.id, item:r};
  }
  const j = tryJournal(); if(j) return {type:'text', item:j};
  return null;
}
function renderLinkedText(raw){
  if(!raw) return '';
  const escaped = escapeHtml(raw);
  return escaped.replace(/\[\[([^\]]+)\]\]/g, (whole, inner) => {
    const resolved = resolveLink(inner);
    if(!resolved) return whole;
    const label = inner.includes(':') ? inner.split(':').slice(1).join(':') : inner;
    const args = resolved.type==='kartei' ? `'kartei','${resolved.item.id}','${resolved.karteiId}'` : `'${resolved.type}','${resolved.item.id}'`;
    return `<button class="link-chip" onclick="navigateToLink(${args})">${label}</button>`;
  });
}
function navigateToLink(type, id, karteiId){
  if(type==='kartei'){ ui.activeTab = karteiId; startEditKarteiEntry(karteiId, id); return; }
  if(type==='text'){
    updateActive(camp=>({...camp, journal: camp.journal.map(j=>j.id===id?{...j, collapsed:false}:j)}));
    ui.activeTab='notes'; saveState(); render();
    setTimeout(()=>{ const el=document.getElementById('journal-'+id); if(el) el.scrollIntoView({behavior:'smooth', block:'center'}); }, 50);
    return;
  }
}

function linkPickerTextareaId(context){

}
function getLinkContextValue(context){
  if(context.type==='kartei') return ui.karteiEntryDraft.notes;
  if(context.type==='journal'){
    const j = getActive().journal.find(j=>j.id===context.entryId);
    return j ? j.value : '';
  }
  return '';
}
function setLinkContextValue(context, value){
  if(context.type==='kartei'){ ui.karteiEntryDraft.notes = value; return; }
  if(context.type==='journal'){
    updateActive(camp=>({...camp, journal: camp.journal.map(j=>j.id===context.entryId?{...j, value}:j)}));
    saveState();
    return;
  }
}
function openLinkPicker(type, entryId){
  const context = entryId ? {type, entryId} : {type};
  const el = document.getElementById(linkPickerTextareaId(context));
  const cursorPos = el ? el.selectionStart : (getLinkContextValue(context)||'').length;
  const active = getActive();
  const candidates = [];
  active.karteien.forEach(k=>{ k.entries.forEach(e=>candidates.push({group:k.name, name:e.title})); });
  active.journal.filter(j=>j.title).forEach(j=>candidates.push({group:'Journal', name:j.title}));
  ui.linkPickerCandidates = candidates;
  ui.linkPicker = {context, cursorPos, query:''};
  render();
  setTimeout(()=>{ const s = document.getElementById('link-picker-search'); if(s) s.focus(); }, 0);
}
function closeLinkPicker(){ ui.linkPicker=null; render(); }
function insertLinkAndClose(idx){
  const candidate = ui.linkPickerCandidates[idx];
  if(!candidate){ closeLinkPicker(); return; }
  const {context, cursorPos} = ui.linkPicker;
  const current = getLinkContextValue(context) || '';
  const insertion = `[[${candidate.name}]]`;
  const pos = Math.max(0, Math.min(cursorPos, current.length));
  const newValue = current.slice(0,pos) + insertion + current.slice(pos);
  setLinkContextValue(context, newValue);
  ui.linkPicker = null;
  render();
  setTimeout(()=>{
    const el = document.getElementById(linkPickerTextareaId(context));
    if(el){ el.focus(); const newPos = pos + insertion.length; el.setSelectionRange(newPos,newPos); }
  }, 0);
}
function filterLinkCandidates(query){
  const q = query.trim().toLowerCase();
  const withIdx = ui.linkPickerCandidates.map((c,idx)=>({group:c.group, name:c.name, idx}));
  if(!q) return withIdx;
  return withIdx.filter(c=>c.name.toLowerCase().includes(q));
}
function renderLinkPickerResultsHTML(list){
  const groups = {};
  list.forEach(c=>{ if(!groups[c.group]) groups[c.group]=[]; groups[c.group].push(c); });
  const groupKeys = Object.keys(groups);
  if(!groupKeys.length) return `<p class="small-muted">Keine Treffer.</p>`;
  return groupKeys.map(g=>`
    <div style="display:flex;flex-direction:column;gap:4px;">
      <span class="small-muted">${escapeHtml(g)}</span>
      ${groups[g].map(it=>`<button class="row between" style="border-radius:8px;padding:8px 10px;background:var(--panel-raised);border:1px solid var(--border);color:var(--text);" onclick="insertLinkAndClose(${it.idx})"><span>${escapeHtml(it.name)}</span></button>`).join('')}
    </div>`).join('');
}
function onLinkPickerSearch(el){
  ui.linkPicker.query = el.value;
  const container = document.getElementById('link-picker-results');
  if(container) container.innerHTML = renderLinkPickerResultsHTML(filterLinkCandidates(el.value));
}
function onLinkPickerSearchKeydown(e){
  if(e.key==='Enter'){
    const filtered = filterLinkCandidates(ui.linkPicker.query||'');
    if(filtered.length) insertLinkAndClose(filtered[0].idx);
  }
}
function renderLinkPickerModal(){
  const initialResults = renderLinkPickerResultsHTML(filterLinkCandidates(ui.linkPicker.query||''));
  return `<div class="modal-overlay" style="z-index:60;">
    <div class="modal-sheet">
      <div class="row between"><span class="label" style="color:var(--gold);">Verlinken</span>
        <button class="icon-btn" onclick="closeLinkPicker()">✕</button></div>
      <input id="link-picker-search" type="text" value="${escapeHtml(ui.linkPicker.query||'')}" placeholder="Tippen zum Filtern…" oninput="onLinkPickerSearch(this)" onkeydown="onLinkPickerSearchKeydown(event)">

function incrementFieldCounter(sectionId, fieldId, delta){
  const s = getCurrentCharacter().sections.find(s=>s.id===sectionId);
  const f = s.fields.find(f=>f.id===fieldId);
  const num = parseFloat(f.value);
  const newVal = String((isNaN(num)?0:num)+delta);
  updateCurrentCharacter(c=>({...c, sections: c.sections.map(s=>s.id===sectionId?{...s, fields:s.fields.map(f=>f.id===fieldId?{...f,value:newVal}:f)}:s)}));

function toggleStatusBox(sectionId, fieldId, boxIdx){
  updateCurrentCharacter(c=>({...c, sections: c.sections.map(s=>s.id===sectionId?{...s, fields:s.fields.map(f=>{
    if(f.id!==fieldId) return f;
    const boxes = [...f.value];
    boxes[boxIdx] = !boxes[boxIdx];
    return {...f, value:boxes};
  })}:s)}));
  saveState(); render();
}
function reduceStatusTier(sectionId, fieldId, amount){
  amount = parseInt(amount,10);
  if(!amount || amount<1) return;
  updateCurrentCharacter(c=>({...c, sections: c.sections.map(s=>s.id===sectionId?{...s, fields:s.fields.map(f=>{
    if(f.id!==fieldId) return f;
    const boxes = [false,false,false,false,false,false];
    f.value.forEach((marked,idx)=>{
      if(!marked) return;
      const newIdx = idx - amount;
      if(newIdx>=0) boxes[newIdx] = true;
    });
    return {...f, value:boxes};
  })}:s)}));
  saveState(); render();
}

// ---- Export / Import ----
function exportData(){
  const activeCampaign = getActiveCampaign();
  const payload = { app:'solo-rpg', exportKind:'campaign', campaign: activeCampaign, data: getActive() };
  const blob = new Blob([JSON.stringify(payload,null,2)], {type:'application/json'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  const stamp = new Date().toISOString().slice(0,16).replace(/[:T]/g,'-');
  const safeName = (activeCampaign?activeCampaign.name:'kampagne').replace(/[^a-z0-9]+/gi,'-').toLowerCase();
  a.href=url; a.download=`solorpg-${safeName}-${stamp}.json`;
  document.body.appendChild(a); a.click(); document.body.removeChild(a);
  URL.revokeObjectURL(url);
}
function triggerImport(){ document.getElementById('file-import').click(); }
function handleImportFile(input){
  const file = input.files[0];
  if(!file) return;
  const reader = new FileReader();
  reader.onload = () => {
    try{
      const parsed = JSON.parse(reader.result);
      if(parsed.campaigns && parsed.campaignData){
        const idMap = {};
        const newCampaigns = parsed.campaigns.map(c=>{ const newId=uid(); idMap[c.id]=newId; return {id:newId, name:c.name}; });
        STATE.campaigns = STATE.campaigns.concat(newCampaigns);
        Object.entries(parsed.campaignData).forEach(([oldId, data])=>{
          if(idMap[oldId]) STATE.campaignData[idMap[oldId]] = data;
        });
        if(newCampaigns[0]) STATE.activeCampaignId = newCampaigns[0].id;
      } else if(parsed.data){
        const newId = uid();
        const name = (parsed.campaign && parsed.campaign.name) || 'Importierte Kampagne';
        STATE.campaigns.push({id:newId, name});
        STATE.campaignData[newId] = parsed.data;
        STATE.activeCampaignId = newId;
      } else {
        alert('Datei ist kein gültiger Solo-RPG-Export.');
        return;
      }
      saveState(); render();
      alert('Import erfolgreich.');
    }catch(e){
      alert('Import fehlgeschlagen: Datei ist kein gültiges JSON.');
    }
  };
  reader.readAsText(file);
  input.value = '';
}

function renderNav(isSidebar){
  const active = getActive();

  const tabsHtml = tabs.map(t=>{
    const isPinned = active.splitView && active.pinnedTabs.includes(t.id);
    const isActive = !active.splitView && ui.activeTab===t.id;
    return `<button class="${isActive?'active':''}" style="${isPinned?'position:relative;':''}" onclick="setActiveTab('${t.id}')"><span class="nav-icon">${t.icon}</span>${t.label}${isPinned?' 📌':''}</button>`;
  }).join('')

function handleOracleRoll(id, ctx){
  ctx = ctx || 'oracle';
  const active = getActive();
  const dice = ctx==='battle' ? active.battleDice : active.oracleDice;
  const die = dice.find(d=>d.id===id);
  if(!die) return;
  const parsed = parseFormula(die.formula);
  if(!parsed){ pushLog(`${die.name}: ungültige Formel "${die.formula}"`, ctx); render(); return; }
  const rolls = Array.from({length:parsed.count}, ()=>rollDie(parsed.sides));
  const sum = rolls.reduce((a,b)=>a+b,0) + parsed.mod;
  const modText = parsed.mod ? (parsed.mod>0?` +${parsed.mod}`:` ${parsed.mod}`) : '';
  pushLog(`${die.name}: [${rolls.join(', ')}]${modText} = ${sum}`, ctx);
  render();
}

function triggerTableImport(){ document.getElementById('file-import-tables').click(); }
function handleTableImportFile(input){
  const files = Array.from(input.files || []);
  if(!files.length) return;
  const readers = files.map(file => new Promise((resolve) => {
    const reader = new FileReader();
    reader.onload = () => {
      try{
        const parsed = JSON.parse(reader.result);
        resolve(Array.isArray(parsed) ? parsed : [parsed]);
      }catch(e){
        resolve([]);
      }
    };
    reader.onerror = () => resolve([]);
    reader.readAsText(file);
  }));
  Promise.all(readers).then(results=>{
    const combined = [].concat(...results);
    ui.importText = JSON.stringify(combined, null, 2);
    render();
  });
  input.value = '';
}

function renderDistControls(aspectId, distMode, formula, entries){
  const aspAttr = aspectId || '';
  const setModeFn = aspectId ? `setAspectDistMode('${aspectId}',` : `setTableDistMode(`;
  const formulaFn = aspectId ? `onAspectFormula('${aspectId}',this)` : `onTableFormula(this)`;
  let coverage = '';
  if(distMode==='dist' && formula){
    const check = checkCoverage(entries, formula);
    if(!check){
      coverage = `<p class="small-muted" style="color:var(--wax);">Ungültige Formel.</p>`;
    } else if(check.gaps.length===0 && check.dupes.length===0){
      coverage = `<p class="small-muted" style="color:var(--gold);">✓ Abdeckung vollständig (${check.range.min}–${check.range.max})</p>`;
    } else {
      const parts = [];
      if(check.gaps.length) parts.push(`Lücke bei ${check.gaps.join(', ')}`);
      if(check.dupes.length) parts.push(`Überschneidung bei ${check.dupes.join(', ')}`);
      coverage = `<p class="small-muted" style="color:var(--wax);">${parts.join(' · ')}</p>`;
    }
  }
  return `
    <div class="mode-toggle">
      <button style="background:${distMode==='equal'?'var(--gold)':'transparent'};color:${distMode==='equal'?'var(--bg)':'var(--text-muted)'};" onclick="${setModeFn}'equal')">Gleich wahrscheinlich</button>

    ${distMode==='dist' ? `<input type="text" value="${escapeHtml(formula)}" placeholder="Würfelformel, z.B. 2W6, 3W7+1" oninput="${formulaFn}" onchange="render()">${coverage}` : ''}
  `;
}

function renderFieldControl(sectionId, f){
  if(f.type==='number'){

    return `<div class="row" style="gap:12px;">
      <button class="counter-btn" onclick="incrementFieldCounter('${sectionId}','${f.id}',-1)">−</button>
      <input type="number" value="${escapeHtml(f.value)}" oninput="onFieldValueInput('${sectionId}','${f.id}',this)" style="width:64px;text-align:center;font-weight:600;">
      <button class="counter-btn" onclick="incrementFieldCounter('${sectionId}','${f.id}',1)">+</button>
    </div>`;
  } else if(f.type==='text'){
    return `<textarea rows="3" oninput="onFieldValueInput('${sectionId}','${f.id}',this)">${escapeHtml(f.value)}</textarea>`;
  } else if(f.type==='list'){
    return `<div style="display:flex;flex-direction:column;gap:6px;">
      ${f.value.map((item,idx)=>`<div class="list-item-row"><span style="flex:1;font-size:14px;">${escapeHtml(item)}</span><button class="x-btn" onclick="removeListItem('${sectionId}','${f.id}',${idx})">✕</button></div>`).join('')}

      </div>
    </div>`;
  } else if(f.type==='status'){
    const inputId = `statusreduce-${f.id}`;
    return renderStatusControl(
      f.value,
      idx=>`toggleStatusBox('${sectionId}','${f.id}',${idx})`,
      iid=>`reduceStatusTier('${sectionId}','${f.id}', document.getElementById('${iid}').value)`,
      ()=>`clearStatusField('${sectionId}','${f.id}')`,
      inputId
    );
  } else if(f.type==='table'){
    const tv = f.value;
    return `<div style="display:flex;flex-direction:column;gap:6px;">
      <div style="overflow-x:auto;padding-bottom:12px;scrollbar-gutter:stable;">
        <table style="border-collapse:collapse;width:100%;min-width:${Math.max(300, tv.columns.length*110)}px;">
          <thead><tr>
            ${tv.columns.map((c,ci)=>`<th style="padding:2px 4px;text-align:left;">
              <div class="row" style="gap:2px;">
                <input type="text" value="${escapeHtml(c)}" oninput="renameTableColumn('${sectionId}','${f.id}',${ci},this)" style="font-size:11px;font-weight:600;padding:4px 6px;">
                ${ui.managing ? `<button class="x-btn" onclick="removeTableColumn('${sectionId}','${f.id}',${ci})">✕</button>` : ''}
              </div>
            </th>`).join('')}
            <th style="width:24px;"></th>
          </tr></thead>
          <tbody>
            ${tv.rows.map((row,ri)=>`<tr>
              ${row.map((cell,ci)=>`<td style="padding:2px;"><input type="text" value="${escapeHtml(cell)}" oninput="onTableCellInput('${sectionId}','${f.id}',${ri},${ci},this)" style="font-size:13px;padding:5px 6px;"></td>`).join('')}
              <td><button class="x-btn" onclick="removeTableRow('${sectionId}','${f.id}',${ri})">✕</button></td>
            </tr>`).join('')}
          </tbody>
        </table>
      </div>
      <div class="row" style="gap:6px;">
        <button class="btn btn-raised" style="padding:4px 10px;font-size:12px;" onclick="addTableRow('${sectionId}','${f.id}')">+ Zeile</button>
        <button class="btn btn-raised" style="padding:4px 10px;font-size:12px;" onclick="addTableColumn('${sectionId}','${f.id}')">+ Spalte</button>
      </div>
    </div>`;
  }
  return '';
}
function renderFieldRow(section, f, fIdx, showTierBadge){
  const tierBadge = showTierBadge ? {surface:'⏱ jede Runde', scene:'◷ pro Szene', rare:'· selten'}[f.tier||'rare'] : '';
  return `<div style="display:flex;flex-direction:column;gap:6px;">
    <div class="field-label-row">
      <span class="small-muted">${escapeHtml(f.name)}${tierBadge?` <span style="opacity:0.6;">(${tierBadge})</span>`:''}</span>
      ${ui.managing ? `<div class="row" style="gap:2px;">

        <button class="icon-btn" style="${fIdx===section.fields.length-1?'opacity:0.3;':''}" ${fIdx===section.fields.length-1?'disabled':''} onclick="moveField('${section.id}','${f.id}',1)">↓</button>

  </div>`;
}

      fieldsHtml = section.fields.map((f,fIdx)=>renderFieldRow(section, f, fIdx, false)).join('');
    }
    return `<div class="panel">
      <div class="row">
        <button class="row" style="flex:1;text-align:left;" onclick="toggleSectionCollapse('${section.id}')">
          <span style="color:var(--text-faint);">${section.collapsed?'▶':'▼'}</span>
          <span style="color:var(--gold);font-weight:600;font-size:14px;">${escapeHtml(section.name)}</span>
        </button>
        ${ui.managing ? `<div class="row" style="gap:4px;">
          <button class="icon-btn" style="${sIdx===0?'opacity:0.3;':''}" ${sIdx===0?'disabled':''} onclick="moveSection('${section.id}',-1)">↑</button>
          <button class="icon-btn" style="${sIdx===currentChar.sections.length-1?'opacity:0.3;':''}" ${sIdx===currentChar.sections.length-1?'disabled':''} onclick="moveSection('${section.id}',1)">↓</button>
          <button class="icon-btn" onclick="startEditSectionName('${section.id}')">✎</button>
          <button class="icon-btn" onclick="startNewField('${section.id}')">+</button>
        </div>` : ''}
      </div>
      ${!section.collapsed ? `<div style="display:flex;flex-direction:column;gap:12px;padding-left:4px;">${fieldsHtml}</div>` : ''}
    </div>`;
  }).join('');

// Quick/reference view: flattens every section's fields into three tiers by
// how often they get looked up, ignoring section boundaries. Surface fields
// (usually counters — HP, ammo, slots) get the biggest, most tappable
// controls; rare fields (saves, gear, lore) sit collapsed at the bottom.
function renderCharacterQuickView(currentChar){
  const surface = [], scene = [], rare = [];
  currentChar.sections.forEach(section=>{
    section.fields.forEach((f,fIdx)=>{
      const entry = {section, f, fIdx};
      if(f.tier==='surface') surface.push(entry);
      else if(f.tier==='scene') scene.push(entry);
      else rare.push(entry);
    });
  });
  let html = '';
  if(surface.length){
    html += `<p class="label" style="margin:2px 0 0;">jede Runde</p>`;
    html += `<div class="grid-cards">` + surface.map(({section,f,fIdx})=>`<div class="panel">${renderFieldRow(section,f,fIdx,false)}</div>`).join('') + `</div>`;
  }
  if(scene.length){
    html += `<p class="label" style="margin:8px 0 0;">pro Szene</p>`;
    html += `<div class="panel">` + scene.map(({section,f,fIdx})=>renderFieldRow(section,f,fIdx,false)).join('<div style="height:8px;"></div>') + `</div>`;
  }
  if(!surface.length && !scene.length){
    html += `<div class="panel empty"><span class="small-muted">Noch keine Felder als „Jede Runde" oder „Pro Szene" markiert. Öffne ein Feld über das Zahnrad (⚙) und die Vollansicht, um seine Häufigkeit einzustellen.</span></div>`;
  }
  if(rare.length){
    html += `<details style="margin-top:8px;">
      <summary class="small-muted" style="cursor:pointer;">▸ selten — ${rare.length} weitere Felder</summary>
      <div class="panel" style="margin-top:8px;">${rare.map(({section,f,fIdx})=>renderFieldRow(section,f,fIdx,false)).join('<div style="height:8px;"></div>')}</div>
    </details>`;
  }
  return html;
}

function renderKarteiTopLevelCard(kartei, e, children){
  const resolvedStyle = kartei.hasCheckbox && e.resolved;
  const checkbox = kartei.hasCheckbox ? `<button class="thread-check ${e.resolved?'done':''}" onclick="toggleKarteiEntryResolved('${kartei.id}','${e.id}')">${e.resolved?'✓':''}</button>` : '';
  const hasExtra = !!e.notes || children.length>0;
  const chevron = hasExtra
    ? `<button onclick="toggleKarteiEntryCollapse('${kartei.id}','${e.id}')" style="color:var(--text-faint);padding:0 2px;flex-shrink:0;">${e.collapsed?'▶':'▼'}</button>`
    : `<span style="width:16px;flex-shrink:0;"></span>`;
  let body = '';
  if(!e.collapsed){
    if(e.notes) body += `<div style="font-size:12px;color:var(--text-muted);white-space:pre-line;">${renderLinkedText(e.notes.length>80?e.notes.slice(0,80)+'…':e.notes)}</div>`;

        content = `<div style="display:flex;flex-direction:column;gap:8px;">

              <input type="text" placeholder="Neuer Eintrag…" onkeydown="if(event.key==='Enter'){addJournalListItem('${entry.id}',this);}" style="flex:1;" id="journal-list-input-${entry.id}">
              <button class="btn btn-gold" style="padding:8px 12px;" onclick="addJournalListItem('${entry.id}', document.getElementById('journal-list-input-${entry.id}'))">+</button>
            </div>
          </div>
        </div>`;
      } else {
        if(isEditing){
          content = `<div style="display:flex;flex-direction:column;gap:8px;">
            ${typeToggle}
            <textarea id="journal-content-textarea-${entry.id}" rows="6" placeholder="Freitext… [[Name]] verlinkt auf NSC/Ort/Thread/Eintrag" oninput="onJournalValueInput('${entry.id}',this)">${escapeHtml(entry.value)}</textarea>
            <div class="row">
              <button class="btn btn-raised" style="padding:6px 10px;font-size:12px;" onclick="openLinkPicker('journal','${entry.id}')">🔗 Verlinken</button>
              <button class="btn btn-raised" style="margin-left:auto;" onclick="finishEditJournalContent()">✓ Fertig</button>
            </div>
          </div>`;
        } else {
          const rendered = entry.value ? renderLinkedText(entry.value) : `<span class="small-muted">(leer)</span>`;
          content = `<div style="display:flex;flex-direction:column;gap:8px;">
            ${typeToggle}
            <div style="font-size:14px;white-space:pre-line;line-height:1.5;">${rendered}</div>
            <button class="btn btn-raised" style="align-self:flex-start;padding:6px 10px;font-size:12px;" onclick="startEditJournalContent('${entry.id}')">✎ Bearbeiten</button>
          </div>`;
        }
      }
    }
    return `<div class="panel" id="journal-${entry.id}">
      <div class="row between">
        <button class="row" style="flex:1;text-align:left;" onclick="toggleJournalCollapse('${entry.id}')">
          <span style="color:var(--text-faint);">${entry.collapsed?'▶':'▼'}</span>
          <input type="text" value="${escapeHtml(entry.title)}" placeholder="Titel…" oninput="onJournalTitleInput('${entry.id}',this)" onclick="event.stopPropagation()" style="flex:1;background:none;border:none;font-weight:600;color:var(--gold);padding:2px 0;">
        </button>
        <button class="x-btn" onclick="deleteJournalEntry('${entry.id}')">🗑</button>
      </div>
      ${content}
    </div>`;
  }).join('');
  return html;
}
function addJournalEntry(){
  const id = uid();
  updateActive(camp=>({...camp, journal: [{id, title:'', type:'text', value:'', collapsed:false}, ...camp.journal]}));
  ui.journalEditingId = id;
  saveState(); render();
}
function toggleJournalCollapse(id){
  updateActive(camp=>({...camp, journal: camp.journal.map(j=>j.id===id?{...j, collapsed:!j.collapsed}:j)}));
  saveState(); render();
}
function setJournalType(id, type){
  updateActive(camp=>({...camp, journal: camp.journal.map(j=>{
    if(j.id!==id) return j;
    if(j.type===type) return j;
    return {...j, type, value: type==='list' ? [] : ''};
  })}));
  saveState(); render();
}
function onJournalTitleInput(id, el){
  updateActive(camp=>({...camp, journal: camp.journal.map(j=>j.id===id?{...j, title:el.value}:j)}));
  saveState();
}
function onJournalValueInput(id, el){
  updateActive(camp=>({...camp, journal: camp.journal.map(j=>j.id===id?{...j, value:el.value}:j)}));
  saveState();
}
function startEditJournalContent(id){ ui.journalEditingId=id; render(); }
function finishEditJournalContent(){ ui.journalEditingId=null; saveState(); render(); }
function addJournalListItem(id, inputEl){
  const text = inputEl.value.trim();

  updateActive(camp=>({...camp, journal: camp.journal.map(j=>j.id===id?{...j, value:[...(j.value||[]),text]}:j)}));

}
function removeJournalListItem(id, idx){

// ============================================================
// Karte (dungeon / hex-crawl node maps)
// ============================================================
function getCurrentMap(){
  const active = getActive();
  return active.maps.find(m=>m.id===active.activeMapId) || active.maps[0] || null;
}
function updateCurrentMap(updater){
  const cur = getCurrentMap();
  if(!cur) return;
  updateActive(camp=>({...camp, maps: camp.maps.map(m=>m.id===cur.id ? updater(m) : m)}));
}
function setActiveMapId(id){
  updateActive(camp=>({...camp, activeMapId:id}));
  ui.selectedMapNodeId=null; ui.mapMoveArmedId=null; ui.mapConnectFrom=null;
  saveState(); render();
}
function addMap(){
  const id = uid();
  updateActive(camp=>({...camp, maps:[...camp.maps, {id, name:'Karte '+(camp.maps.length+1), description:'', markerNodeId:null, nodes:[], edges:[]}], activeMapId:id}));
  saveState(); render();
}
function deleteMap(id){
  updateActive(camp=>{
    const maps = camp.maps.filter(m=>m.id!==id);
    return {...camp, maps, activeMapId: camp.activeMapId===id ? (maps[0]?maps[0].id:null) : camp.activeMapId};
  });

}
function onMapNameInput(el){ updateCurrentMap(m=>({...m, name:el.value})); saveState(); }
function onMapDescInput(el){ updateCurrentMap(m=>({...m, description:el.value})); saveState(); }
function addMapNode(){
  const cur = getCurrentMap();
  if(!cur) return;
  const idx = cur.nodes.length;
  addMapNodeAt(60+(idx%4)*80, 50+Math.floor(idx/4)*80);
}
function addMapNodeAt(x, y){
  const cur = getCurrentMap();
  if(!cur) return;
  const idx = cur.nodes.length;
  const node = {id:uid(), name:'Raum '+(idx+1), num: idx+1, x:Math.round(x), y:Math.round(y), r:16, desc:''};
  updateCurrentMap(m=>({...m, nodes:[...m.nodes, node]}));
  saveState(); render();
}
function toggleMapConnectMode(){
  ui.mapMoveArmedId = null;
  ui.mapConnectFrom = (ui.mapConnectFrom==null) ? 'PENDING' : null;
  render();
}
function armMoveMapNode(id){ ui.mapConnectFrom=null; ui.mapMoveArmedId=id; render(); }
function cancelMoveMapNode(){ ui.mapMoveArmedId=null; render(); }
function selectMapNode(id){
  if(ui.managing){
    if(ui.mapConnectFrom==='PENDING'){ ui.mapConnectFrom=id; render(); return; }
    if(ui.mapConnectFrom && ui.mapConnectFrom!=='PENDING'){
      if(ui.mapConnectFrom!==id) startNewMapEdge(ui.mapConnectFrom, id);
      ui.mapConnectFrom=null; render(); return;
    }
    if(ui.mapMoveArmedId) return;
    startEditMapNode(id);
    return;
  }
  ui.selectedMapNodeId = (ui.selectedMapNodeId===id) ? null : id;
  render();
}
function onMapCanvasClick(evt){
  if(!ui.managing) return;
  const svg = evt.currentTarget;
  const rect = svg.getBoundingClientRect();
  const vb = svg.viewBox.baseVal;
  const x = Math.round((evt.clientX-rect.left)/rect.width*vb.width + vb.x);
  const y = Math.round((evt.clientY-rect.top)/rect.height*vb.height + vb.y);
  if(ui.mapMoveArmedId){
    const id = ui.mapMoveArmedId;
    updateCurrentMap(m=>({...m, nodes: m.nodes.map(n=>n.id===id?{...n,x,y}:n)}));
    ui.mapMoveArmedId=null;
    saveState(); render();
    return;
  }
  if(ui.mapConnectFrom){
    // tapping empty space cancels an in-progress connection instead of adding a room
    ui.mapConnectFrom=null; render();
    return;
  }
  addMapNodeAt(x, y);
}

  updateCurrentMap(m=>({...m, markerNodeId:nodeId}));

}

// ============================================================
// Beziehungen (directed relationship / faction web)
// ============================================================
// Force-directed layout (nodes repel each other, edges pull their two ends
// together like springs), seeded from a circle so it's stable and doesn't
// jump around between renders. No position is stored — this is recomputed
// every time from the node/edge list, which is why the graph settles into
// the same layout as long as the underlying data hasn't changed. This is
// what spaces out connected/unconnected factions instead of leaving every
// node on a fixed ring regardless of how they relate to each other.
function getRelationLayout(){
  const active = getActive();
  const list = active.relationNodes;
  const n = list.length;
  if(n===0) return [];
  const cx=200, cy=200;
  const pos = list.map((node,i)=>{
    const angle = (2*Math.PI*i/n) - Math.PI/2;
    return {x: cx + (n>1 ? 150*Math.cos(angle) : 0), y: cy + (n>1 ? 150*Math.sin(angle) : 0)};
  });
  if(n>1){
    const idx = {}; list.forEach((node,i)=>idx[node.id]=i);
    const edges = active.relationEdges;
    const REPULSION = 9000, SPRING = 0.02, IDEAL_LEN = 130, CENTER_PULL = 0.01;
    for(let iter=0; iter<300; iter++){
      const fx = new Array(n).fill(0), fy = new Array(n).fill(0);
      for(let i=0;i<n;i++){
        for(let j=i+1;j<n;j++){
          let dx = pos[i].x-pos[j].x, dy = pos[i].y-pos[j].y;
          let d2 = dx*dx+dy*dy; if(d2<1) d2=1;
          const d = Math.sqrt(d2);
          const f = REPULSION/d2;
          fx[i]+=f*dx/d; fy[i]+=f*dy/d;
          fx[j]-=f*dx/d; fy[j]-=f*dy/d;
        }
      }
      edges.forEach(e=>{
        const i=idx[e.from], j=idx[e.to];
        if(i==null||j==null||i===j) return;
        const dx = pos[j].x-pos[i].x, dy = pos[j].y-pos[i].y;
        const d = Math.hypot(dx,dy)||1;
        const f = SPRING*(d-IDEAL_LEN);
        fx[i]+=f*dx/d; fy[i]+=f*dy/d;
        fx[j]-=f*dx/d; fy[j]-=f*dy/d;
      });
      for(let i=0;i<n;i++){
        fx[i] += (cx-pos[i].x)*CENTER_PULL;
        fy[i] += (cy-pos[i].y)*CENTER_PULL;
        pos[i].x += fx[i]*0.5; pos[i].y += fy[i]*0.5;
      }
    }
    const margin = 55;
    pos.forEach(p=>{ p.x = Math.max(margin, Math.min(400-margin, p.x)); p.y = Math.max(margin, Math.min(400-margin, p.y)); });
  }
  return list.map((node,i)=>({...node, x:pos[i].x, y:pos[i].y}));
}
function addRelationNode(){
  const id = uid();
  updateActive(camp=>({...camp, relationNodes:[...camp.relationNodes, {id, name:'Neu'}]}));
  saveState();
  startEditRelationNode(id);
}
function toggleRelationConnectMode(){
  ui.relationsConnectFrom = (ui.relationsConnectFrom==null) ? 'PENDING' : null;
  render();
}
function selectRelationNode(id){
  if(ui.relationsConnectFrom==='PENDING'){ ui.relationsConnectFrom=id; render(); return; }
  if(ui.relationsConnectFrom && ui.relationsConnectFrom!=='PENDING'){
    if(ui.relationsConnectFrom!==id) startNewRelationEdge(ui.relationsConnectFrom, id);
    ui.relationsConnectFrom=null; render(); return;
  }
  startEditRelationNode(id);
}
function startEditRelationNode(id){
  const active = getActive();
  const n = active.relationNodes.find(x=>x.id===id);
  if(!n) return;
  ui.editingRelationNodeId = id;
  ui.relationNodeDraft = {name:n.name};
  render();
}
function cancelRelationNodeModal(){ ui.editingRelationNodeId=null; ui.relationNodeDraft=null; render(); }
function saveRelationNode(){
  const id = ui.editingRelationNodeId, d = ui.relationNodeDraft;
  updateActive(camp=>({...camp, relationNodes: camp.relationNodes.map(n=>n.id===id?{...n, name:d.name.trim()||n.name}:n)}));
  ui.editingRelationNodeId=null; ui.relationNodeDraft=null;
  saveState(); render();
}
function deleteRelationNode(id){
  updateActive(camp=>({...camp,
    relationNodes: camp.relationNodes.filter(n=>n.id!==id),
    relationEdges: camp.relationEdges.filter(e=>e.from!==id && e.to!==id),
  }));
  ui.editingRelationNodeId=null; ui.relationNodeDraft=null;
  saveState(); render();
}
let relationLongPressTimer = null;
let relationLongPressFired = false;
function relationEdgePointerDown(evt, edgeId){
  relationLongPressFired = false;
  if(relationLongPressTimer) clearTimeout(relationLongPressTimer);
  relationLongPressTimer = setTimeout(()=>{ relationLongPressFired = true; startEditRelationEdge(edgeId); }, 450);
}
function relationEdgePointerUp(){
  if(relationLongPressTimer){ clearTimeout(relationLongPressTimer); relationLongPressTimer=null; }
}
function relationEdgeClick(evt, edgeId){
  evt.stopPropagation();
  if(relationLongPressFired){ relationLongPressFired=false; return; }
  rollRelationEdge(edgeId);
}
function rollRelationEdge(id){
  const active = getActive();
  const e = active.relationEdges.find(x=>x.id===id);
  if(!e) return;
  ui.relationRollResult = {edgeId:id, roll: rollDie(20), weight:e.weight};
  render();
}
function startNewRelationEdge(fromId, toId){
  ui.editingRelationEdgeId = 'new';
  ui.relationEdgeDraft = {from:fromId, to:toId, label:'kennt', weight:10};
  render();
}
function startEditRelationEdge(id){
  const active = getActive();
  const e = active.relationEdges.find(x=>x.id===id);
  if(!e) return;
  ui.editingRelationEdgeId = id;
  ui.relationEdgeDraft = {from:e.from, to:e.to, label:e.label, weight:e.weight};
  render();
}
function cancelRelationEdgeModal(){ ui.editingRelationEdgeId=null; ui.relationEdgeDraft=null; render(); }
function saveRelationEdge(){
  const d = ui.relationEdgeDraft;
  if(ui.editingRelationEdgeId==='new'){
    const id = uid();
    updateActive(camp=>({...camp, relationEdges:[...camp.relationEdges, {id, from:d.from, to:d.to, label:(d.label||'').trim()||'kennt', weight:Math.max(1,Math.min(20,parseInt(d.weight,10)||10))}]}));
  } else {
    const id = ui.editingRelationEdgeId;
    updateActive(camp=>({...camp, relationEdges: camp.relationEdges.map(e=>e.id===id?{...e, label:(d.label||'').trim()||e.label, weight:Math.max(1,Math.min(20,parseInt(d.weight,10)||e.weight))}:e)}));
  }
  ui.editingRelationEdgeId=null; ui.relationEdgeDraft=null;
  saveState(); render();
}
function deleteRelationEdge(id){
  updateActive(camp=>({...camp, relationEdges: camp.relationEdges.filter(e=>e.id!==id)}));
  ui.editingRelationEdgeId=null; ui.relationEdgeDraft=null;
  saveState(); render();
}
function renderRelationsTab(){
  const active = getActive();
  let html = '';
  if(ui.managing){
    const connectLabel = ui.relationsConnectFrom==='PENDING' ? '🔗 Ersten Knoten tippen…' : (ui.relationsConnectFrom ? '🔗 Zweiten Knoten tippen…' : '🔗 Verbinden');
    html += `<div class="row wrap" style="gap:8px;">
      <button class="btn btn-gold" style="padding:6px 10px;font-size:12px;" onclick="addRelationNode()">+ Person/Fraktion</button>
      <button class="btn ${ui.relationsConnectFrom?'btn-gold':'btn-raised'}" style="padding:6px 10px;font-size:12px;" onclick="toggleRelationConnectMode()">${connectLabel}</button>
    </div>`;
  }
  if(active.relationNodes.length===0){
    html += `<div class="panel empty"><span>Noch keine Personen/Fraktionen angelegt.</span>
      <button class="btn btn-raised" onclick="addRelationNode()">+ Erste anlegen</button></div>`;
    return html;
  }

  const nodes = getRelationLayout();
  const nodeBoxes = {};
  nodes.forEach(n=>{ nodeBoxes[n.id] = {w:nodeBoxWidth(n.name), h:34}; });
  const geoms = curvedEdgeGeometry(nodes, active.relationEdges, 26);
  const labelGeoms = geoms.map(g=>({cx:g.mx, cy:g.my, w:labelBoxWidth(`${g.edge.label} ${g.edge.weight}`), h:18, edgeId:g.edge.id}));
  resolveLabelOverlaps(labelGeoms, 8);
  const labelById = {}; labelGeoms.forEach(l=>labelById[l.edgeId]=l);

  const edgesSvg = geoms.map(g=>{
    const A=g.A, B=g.B, e=g.edge;
    const boxA = nodeBoxes[A.id], boxB = nodeBoxes[B.id];
    const start = rectEdgePoint(A.x, A.y, boxA.w/2, boxA.h/2, g.mx, g.my);
    const end = rectEdgePoint(B.x, B.y, boxB.w/2, boxB.h/2, g.mx, g.my);
    const d = `M ${start.x} ${start.y} Q ${g.mx} ${g.my} ${end.x} ${end.y}`;
    const lbl = labelById[e.id];
    return `<g style="cursor:pointer;"
        onpointerdown="relationEdgePointerDown(event,'${e.id}')" onpointerup="relationEdgePointerUp()" onpointerleave="relationEdgePointerUp()"
        onclick="relationEdgeClick(event,'${e.id}')">
      <path d="${d}" fill="none" stroke="var(--gold-dim)" stroke-width="2" marker-end="url(#rel-arrow)"></path>
      <path d="${d}" fill="none" stroke="transparent" stroke-width="18"></path>
      <rect x="${lbl.cx-lbl.w/2}" y="${lbl.cy-lbl.h/2}" width="${lbl.w}" height="${lbl.h}" rx="4" fill="var(--bg)" stroke="var(--border)"></rect>
      <text x="${lbl.cx}" y="${lbl.cy+4}" text-anchor="middle" font-size="10" fill="var(--text-muted)">${escapeHtml(e.label)} ${escapeHtml(e.weight)}</text>
    </g>`;
  }).join('');
  const nodesSvg = nodes.map(n=>{
    const box = nodeBoxes[n.id];
    return `<g onclick="event.stopPropagation(); selectRelationNode('${n.id}')" style="cursor:pointer;">
      <rect x="${n.x-box.w/2}" y="${n.y-box.h/2}" width="${box.w}" height="${box.h}" rx="6" fill="var(--panel-raised)" stroke="var(--gold-dim)" stroke-width="2"></rect>
      <text x="${n.x}" y="${n.y+4}" text-anchor="middle" font-size="12" fill="var(--text)">${escapeHtml(n.name)}</text>
    </g>`;
  }).join('');

  html += `<div class="panel" style="padding:6px;">
    <div class="map-svg-wrap">
      <svg viewBox="0 0 400 400" width="400" height="400">
        <defs>
          <marker id="rel-arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
            <path d="M0,0 L10,5 L0,10 z" fill="var(--gold-dim)"></path>
          </marker>
        </defs>
        ${edgesSvg}
        ${nodesSvg}
      </svg>
    </div>
  </div>`;

  if(ui.relationRollResult){
    html += `<div class="panel"><div class="row between">
      <span style="font-size:15px;">🎲 Gerollt ${ui.relationRollResult.roll} vs ${ui.relationRollResult.weight}</span>
      <button class="icon-btn" onclick="ui.relationRollResult=null; render();">✕</button>
    </div></div>`;
  }
  html += `<p class="small-muted">Tippen = würfeln · Halten = Beziehung bearbeiten · Knoten tippen = umbenennen</p>`;
  return html;
}
function renderRelationNodeModal(){
  const d = ui.relationNodeDraft, id = ui.editingRelationNodeId;
  return `<div class="modal-overlay"><div class="modal-sheet">
    <div class="row between"><span class="label" style="color:var(--gold);">Umbenennen</span>
      <button class="icon-btn" onclick="cancelRelationNodeModal()">✕</button></div>
    <input type="text" value="${escapeHtml(d.name)}" placeholder="Name der Person/Fraktion" oninput="ui.relationNodeDraft.name=this.value;">
    <div class="row">
      <button class="btn btn-outline-wax" onclick="deleteRelationNode('${id}')">🗑 Löschen</button>
      <button class="btn btn-gold" style="flex:1;" onclick="saveRelationNode()">✓ Speichern</button>
    </div>
  </div></div>`;
}
function renderRelationEdgeModal(){
  const d = ui.relationEdgeDraft;
  const isNew = ui.editingRelationEdgeId==='new';
  const active = getActive();
  const fromNode = active.relationNodes.find(n=>n.id===d.from);
  const toNode = active.relationNodes.find(n=>n.id===d.to);
  return `<div class="modal-overlay"><div class="modal-sheet">
    <div class="row between"><span class="label" style="color:var(--gold);">${isNew?'Neue Beziehung':'Beziehung bearbeiten'}</span>
      <button class="icon-btn" onclick="cancelRelationEdgeModal()">✕</button></div>
    <span class="small-muted">${escapeHtml(fromNode?fromNode.name:'?')} → ${escapeHtml(toNode?toNode.name:'?')}</span>
    <input type="text" value="${escapeHtml(d.label)}" placeholder="Art der Beziehung (liebt, hasst, beneidet…)" oninput="ui.relationEdgeDraft.label=this.value;">
    <div class="row between">
      <span class="small-muted">Gewicht (Wahrscheinlichkeit, 1–20)</span>
      <span class="small-muted" id="relEdgeWVal">${d.weight}</span>
    </div>
    <input type="range" min="1" max="20" value="${d.weight}" oninput="ui.relationEdgeDraft.weight=this.value; document.getElementById('relEdgeWVal').textContent=this.value;">
    <div class="row">
      ${!isNew ? `<button class="btn btn-outline-wax" onclick="deleteRelationEdge('${ui.editingRelationEdgeId}')">🗑 Löschen</button>` : ''}
      <button class="btn btn-gold" style="flex:1;" onclick="saveRelationEdge()">✓ Speichern</button>
    </div>
  </div></div>`;
}

loadState();
document.getElementById('file-import').addEventListener('change', function(){ handleImportFile(this); });
document.getElementById('file-import-tables').addEventListener('change', function(){ handleTableImportFile(this); });
let resizeIsWide = window.innerWidth>=900;
window.addEventListener('resize', function(){
  const nowWide = window.innerWidth>=900;
  if(nowWide !== resizeIsWide){
    resizeIsWide = nowWide;
    render();
  }
});
render();
if('serviceWorker' in navigator){
  navigator.serviceWorker.register('sw.js');
}
</script>
